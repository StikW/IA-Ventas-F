<div class="app-shell">
  <aside class="app-sidebar" aria-label="Navegación principal">
    <a class="brand" routerLink="/business">
      <span class="brand-mark">N</span>
      IA Ventas
    </a>

    <nav class="sidebar-nav">
      <a routerLink="/business" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
        <nv-icon name="home" [size]="20" />
        Inicio
      </a>
      <a routerLink="/business/documents" routerLinkActive="active">
        <nv-icon name="catalog" [size]="20" />
        Catálogo
      </a>
      <a routerLink="/business/woocommerce" routerLinkActive="active">
        <nv-icon name="store" [size]="20" />
        Tienda
      </a>
      <a routerLink="/business/whatsapp" routerLinkActive="active" class="whatsapp-link">
        <nv-icon name="whatsapp" [size]="20" />
        WhatsApp
      </a>
      <a routerLink="/business/settings" routerLinkActive="active">
        <nv-icon name="settings" [size]="20" />
        Ajustes
      </a>
    </nav>

    <div class="sidebar-foot">
      <div class="sidebar-user">
        <span class="user-avatar">{{ userInitials() }}</span>
        <span class="user-name">{{ userLabel() }}</span>
      </div>
      <button class="sidebar-logout" type="button" (click)="logout()">
        <nv-icon name="logout" [size]="18" />
        Cerrar sesión
      </button>
    </div>
  </aside>

  <div class="app-body">
    <header class="mobile-header">
      <a class="brand" routerLink="/business">
        <span class="brand-mark">N</span>
        IA Ventas
      </a>
      <div class="mobile-header-end">
        <span class="user-avatar" [attr.title]="userLabel()">{{ userInitials() }}</span>
        <button class="btn-logout" type="button" (click)="logout()" aria-label="Cerrar sesión">
          <nv-icon name="logout" [size]="18" />
        </button>
      </div>
    </header>

    <main class="app-main">
      <div class="app-main-inner">
        <router-outlet />
      </div>
    </main>
  </div>
</div>

<nav class="bottom-nav" aria-label="Acceso rápido">
  <a routerLink="/business" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
    <nv-icon name="home" [size]="22" />
    Inicio
  </a>
  <a routerLink="/business/documents" routerLinkActive="active">
    <nv-icon name="catalog" [size]="22" />
    Catálogo
  </a>
  <a routerLink="/business/woocommerce" routerLinkActive="active">
    <nv-icon name="store" [size]="22" />
    Tienda
  </a>
  <a routerLink="/business/whatsapp" routerLinkActive="active" class="whatsapp-tab">
    <nv-icon name="whatsapp" [size]="22" />
    WhatsApp
  </a>
  <a routerLink="/business/settings" routerLinkActive="active">
    <nv-icon name="settings" [size]="22" />
    Ajustes
  </a>
</nav>
