<div class="app-shell">
  <aside class="app-sidebar" aria-label="Navegación admin">
    <a class="brand" routerLink="/admin/businesses">
      <span class="brand-mark">N</span>
      IA Ventas
      <span class="admin-tag">Admin</span>
    </a>

    <nav class="sidebar-nav">
      <a routerLink="/admin/businesses" routerLinkActive="active">
        <nv-icon name="businesses" [size]="20" />
        Negocios
      </a>
    </nav>

    <div class="sidebar-foot">
      <div class="sidebar-user">
        <span class="user-avatar">{{ userInitials() }}</span>
        <span class="user-name">{{ userLabel() }}</span>
      </div>
      <button class="sidebar-logout" type="button" (click)="logout()">
        <nv-icon name="logout" [size]="18" />
        Cerrar sesión
      </button>
    </div>
  </aside>

  <div class="app-body">
    <header class="mobile-header">
      <a class="brand" routerLink="/admin/businesses">
        <span class="brand-mark">N</span>
        IA Ventas
        <span class="admin-tag">Admin</span>
      </a>
      <div class="mobile-header-end">
        <span class="user-avatar" [attr.title]="userLabel()">{{ userInitials() }}</span>
        <button class="menu-toggle" type="button" (click)="toggleMenu()" aria-label="Menú">
          <nv-icon [name]="menuToggleIcon()" [size]="20" />
        </button>
      </div>
    </header>

    <main class="app-main">
      <div class="app-main-inner">
        <router-outlet />
      </div>
    </main>
  </div>
</div>

@if (menuOpen()) {
  <div class="mobile-nav-backdrop" (click)="closeMenu()" aria-hidden="true"></div>
  <nav class="mobile-nav" aria-label="Menú móvil">
    <div class="mobile-nav-head">
      <span class="brand-mark">N</span>
      <button class="btn-logout" type="button" (click)="closeMenu()" aria-label="Cerrar">
        <nv-icon name="close" [size]="18" />
      </button>
    </div>
    <a routerLink="/admin/businesses" routerLinkActive="active">
      <nv-icon name="businesses" [size]="20" /> Negocios
    </a>
    <div class="mobile-nav-foot">
      <button class="mobile-logout" type="button" (click)="logout()">
        <nv-icon name="logout" [size]="20" /> Cerrar sesión
      </button>
    </div>
  </nav>
}
